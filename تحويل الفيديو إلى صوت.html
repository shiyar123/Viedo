<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحويل الفيديو إلى صوت</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1b1d2a;--muted:#6b7089;--accent:#4f46e5;--accent-text:#fff;--line:#e3e5ef;--ok:#0f9d58;--err:#d93025;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12131a;--card:#1c1e2b;--text:#eceef8;--muted:#9aa0bd;--accent:#7c8cff;--accent-text:#0d0f1c;--line:#2d3042;--ok:#4cd68a;--err:#ff7b72}}
:root[data-theme="dark"]{--bg:#12131a;--card:#1c1e2b;--text:#eceef8;--muted:#9aa0bd;--accent:#7c8cff;--accent-text:#0d0f1c;--line:#2d3042;--ok:#4cd68a;--err:#ff7b72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.4rem;margin:8px 0 4px}
p.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:28px 12px;text-align:center;cursor:pointer}
.drop strong{display:block;font-size:1.05rem}
.drop span{color:var(--muted);font-size:.85rem;word-break:break-all}
input[type=file]{display:none}
label.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:1rem}
button{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;font-size:1.05rem;font-weight:600;background:var(--accent);color:var(--accent-text);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#msg{margin-top:12px;font-size:.95rem;min-height:1.4em}
.ok{color:var(--ok)}.err{color:var(--err)}
audio{width:100%;margin-top:14px;display:none}
.note{color:var(--muted);font-size:.82rem;margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>🎧 تحويل الفيديو إلى صوت</h1>
  <p class="sub">التحويل يتم داخل متصفحك، ولا يُرفع الفيديو إلى أي خادم.</p>

  <div class="card">
    <label class="drop" for="f">
      <strong>اضغط لاختيار فيديو</strong>
      <span id="fname">MP4 ‏/ MOV ‏/ WebM ‏/ MKV</span>
    </label>
    <input id="f" type="file" accept="video/*,audio/*">

    <label class="row">جودة MP3
      <select id="kbps">
        <option value="96">96 كيلوبت (حجم صغير)</option>
        <option value="128" selected>128 كيلوبت (متوازن)</option>
        <option value="192">192 كيلوبت (جودة عالية)</option>
        <option value="320">320 كيلوبت (أعلى جودة)</option>
      </select>
    </label>

    <button id="go" disabled>حوّل إلى MP3</button>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div id="msg"></div>
    <audio id="player" controls></audio>
    <button id="save" style="display:none">حفظ الملف</button>
    <p class="note" id="zipnote" style="display:none">يُحفظ الملف داخل ملف ZIP لأن المنصة لا تسمح بحفظ MP3 مباشرة. فك الضغط عنه وستجد ملف MP3 بداخله.</p>
  </div>
  <p class="note">الفيديوهات الكبيرة جداً (أكثر من 1 جيجابايت) قد لا تعمل لأن المتصفح يحمّل الملف في الذاكرة.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let file = null, mp3Blob = null, baseName = "audio", downloads = null;

claude.use("downloads").then(d => { downloads = d; }).catch(() => {});

function say(t, cls) { $("msg").textContent = t; $("msg").className = cls || ""; }
function progress(p) { $("bar").style.display = "block"; $("fill").style.width = Math.round(p * 100) + "%"; }

$("f").addEventListener("change", e => {
  file = e.target.files[0] || null;
  mp3Blob = null;
  $("save").style.display = "none"; $("zipnote").style.display = "none"; $("player").style.display = "none";
  $("bar").style.display = "none";
  if (file) {
    $("fname").textContent = file.name + " (" + (file.size / 1048576).toFixed(1) + " ميجابايت)";
    baseName = file.name.replace(/\.[^.]+$/, "").replace(/[\\/:*?"<>|]/g, "_") || "audio";
    $("go").disabled = false; say("");
  }
});

const tick = () => new Promise(r => setTimeout(r, 0));

$("go").addEventListener("click", async () => {
  if (!file) return;
  $("go").disabled = true; $("save").style.display = "none"; $("zipnote").style.display = "none";
  try {
    say("جاري قراءة الفيديو…"); progress(0.02); await tick();
    const buf = await file.arrayBuffer();
    say("جاري استخراج الصوت…"); await tick();
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
    let audio;
    try { audio = await ctx.decodeAudioData(buf); }
    catch (e) { throw new Error("تعذّر قراءة الصوت من هذا الملف، أو لا يحتوي على صوت."); }
    ctx.close();

    const ch = Math.min(audio.numberOfChannels, 2);
    const kbps = +$("kbps").value;
    const enc = new lamejs.Mp3Encoder(ch, audio.sampleRate, kbps);
    const to16 = f => { const o = new Int16Array(f.length); for (let i = 0; i < f.length; i++) { const s = Math.max(-1, Math.min(1, f[i])); o[i] = s < 0 ? s * 32768 : s * 32767; } return o; };
    const L = to16(audio.getChannelData(0));
    const R = ch === 2 ? to16(audio.getChannelData(1)) : null;
    const parts = [], block = 1152 * 20;
    say("جاري التحويل إلى MP3…");
    for (let i = 0; i < L.length; i += block) {
      const out = ch === 2 ? enc.encodeBuffer(L.subarray(i, i + block), R.subarray(i, i + block)) : enc.encodeBuffer(L.subarray(i, i + block));
      if (out.length) parts.push(new Uint8Array(out));
      if ((i / block) % 10 === 0) { progress(0.05 + 0.95 * i / L.length); await tick(); }
    }
    const end = enc.flush(); if (end.length) parts.push(new Uint8Array(end));
    mp3Blob = new Blob(parts, { type: "audio/mpeg" });
    progress(1);
    say("تم التحويل ✔ (" + (mp3Blob.size / 1048576).toFixed(1) + " ميجابايت)", "ok");
    $("player").src = URL.createObjectURL(mp3Blob); $("player").style.display = "block";
    if (downloads) { $("save").style.display = "block"; $("zipnote").style.display = "block"; }
  } catch (e) { say(e.message || "حدث خطأ أثناء التحويل", "err"); }
  $("go").disabled = false;
});

/* ملف ZIP بدون ضغط */
const crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u) { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = crcT[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(name, data) {
  const nm = new TextEncoder().encode(name), crc = crc32(data), n = data.length;
  const lh = new DataView(new ArrayBuffer(30)), ch = new DataView(new ArrayBuffer(46)), eh = new DataView(new ArrayBuffer(22));
  lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint32(14, crc, true); lh.setUint32(18, n, true); lh.setUint32(22, n, true); lh.setUint16(26, nm.length, true);
  ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint32(16, crc, true); ch.setUint32(20, n, true); ch.setUint32(24, n, true); ch.setUint16(28, nm.length, true);
  const cdOff = 30 + nm.length + n, cdSize = 46 + nm.length;
  eh.setUint32(0, 0x06054b50, true); eh.setUint16(8, 1, true); eh.setUint16(10, 1, true); eh.setUint32(12, cdSize, true); eh.setUint32(16, cdOff, true);
  return new Blob([lh, nm, data, ch, nm, eh], { type: "application/zip" });
}

$("save").addEventListener("click", async () => {
  if (!mp3Blob || !downloads) return;
  try {
    const data = new Uint8Array(await mp3Blob.arrayBuffer());
    await downloads.save({ filename: baseName + ".zip", data: makeZip(baseName + ".mp3", data) });
    say("تم الحفظ ✔", "ok");
  } catch (e) {
    if (e && e.code === "declined") say("تم إلغاء الحفظ.");
    else say("تعذّر الحفظ.", "err");
  }
});
</script>
</body>
</html>
